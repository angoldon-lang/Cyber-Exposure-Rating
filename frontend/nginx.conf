server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Header di sicurezza (sezione 19).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 4m;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Applicazione a pagina singola: ogni rotta serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `index.html` non deve MAI essere servito dalla cache del browser.
    #
    # E' l'unico file con un nome fisso: contiene i riferimenti ai bundle,
    # che hanno nel nome l'impronta del contenuto. Senza direttiva di cache
    # il browser lo conserva secondo la propria euristica, continua a
    # chiedere i bundle della versione precedente e - trovandoli in cache
    # come `immutable` - mostra la versione vecchia dell'interfaccia per
    # settimane. Chi aggiorna ricostruisce le immagini e non vede cambiare
    # nulla, senza un errore da nessuna parte.
    #
    # Si usa `expires`, non `add_header`: un `add_header` in questo blocco
    # azzererebbe quelli del livello superiore, e la pagina perderebbe la
    # Content-Security-Policy e gli altri header di sicurezza.
    location = /index.html {
        expires -1;
    }

    # I bundle hanno l'impronta nel nome: contenuto diverso, nome diverso.
    # La cache lunga e' sicura solo a questa condizione.
    location ~* \.(js|css|woff2?|svg|png|jpg)$ {
        # Un solo Cache-Control: `expires` ne emette gia' uno per conto suo,
        # e insieme all'add_header il browser ne riceveva due.
        add_header Cache-Control "public, max-age=2592000, immutable";
        # `add_header` qui azzera quelli del server: `nosniff` va ripetuto,
        # perche' su un file JavaScript e' l'header che conta davvero.
        add_header X-Content-Type-Options "nosniff" always;
    }
}
