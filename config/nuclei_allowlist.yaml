    approved_at: "2026-01-15"

  - id: "git-config"
    version: "1.0.0"
    description_it: "File .git/config esposto"
    severity: high
    request_type: http
    classification: information-disclosure
    timeout_seconds: 10
    max_requests: 1
    approved: true
    approved_by: "defenix-security-board"
    approved_at: "2026-01-15"

  - id: "env-file-exposure"
    version: "1.0.0"
