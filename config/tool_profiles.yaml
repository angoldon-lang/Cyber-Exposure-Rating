# Matrice tool x profilo di scansione.
# Un tool non elencato in un profilo NON puo' essere eseguito in quel profilo.
# Il gate e' applicato dal ScopeGuard prima di ogni ToolRun.
version: "1.0.0"

profiles:
  public_passive:
    label_it: "Public Passive Check"
    label_en: "Public Passive Check"
    requires_verification: false
    requires_authorization: false
    description_it: >-
      Analisi esclusivamente passiva su fonti pubbliche. Nessun contatto
      intrusivo con l'infrastruttura del target.
    forbidden_actions:
      - port_scanning
      - vulnerability_scanning
      - brute_force
      - aggressive_crawling
      - authentication_attempts
      - exploitation
      - fuzzing
      - intrusive_checks
    tools: [dns, rdap, certificate_transparency, ip_perimeter, email_discovery,
            subfinder, spiderfoot, checkdmarc, ransomware_live, hibp,
            credential_exposure, xposedornot, dnstwist_passive, kev, epss]

  verified_standard:
    label_it: "Verified Standard Check"
    label_en: "Verified Standard Check"
    requires_verification: true
    requires_authorization: true
    description_it: >-
      Aggiunge richieste HTTP/HTTPS normali, analisi header, fingerprinting,
      verifica TLS e ZAP Baseline. Nessun exploit, nessuna modifica di dati.
    forbidden_actions:
      - port_scanning
      - exploitation
      - brute_force
      - data_modification
      - fuzzing
    tools: [dns, rdap, certificate_transparency, ip_perimeter, email_discovery,
            subfinder, spiderfoot, checkdmarc, ransomware_live, hibp,
            credential_exposure, xposedornot, dnstwist, kev, epss,
            httpx, testssl, zap_baseline, amass_passive, email_header, email_harvest]

  verified_extended:
    label_it: "Verified Extended Check"
    label_en: "Verified Extended Check"
    requires_verification: true
    requires_authorization: true
    requires_explicit_scope_whitelist: true
    description_it: >-
      Aggiunge port scanning controllato, service discovery e Nuclei con
      template approvati. Solo su IP/domini/URL esplicitamente in whitelist.
    forbidden_actions:
      - credential_stuffing
      - password_spraying
      - brute_force
      - login_attempts
      - active_sql_injection
      - denial_of_service
      - file_upload
      - payload_execution
      - data_modification
      - destructive_exploits
      - third_party_scanning
    tools: [dns, rdap, certificate_transparency, ip_perimeter, email_discovery,
            subfinder, spiderfoot, checkdmarc, ransomware_live, hibp,
            credential_exposure, xposedornot, dnstwist, kev, epss,
            httpx, testssl, zap_baseline, amass, email_header, email_harvest,
            naabu, port_scan, nmap, nuclei]

# ------------------------------------------------------------------
# Definizione dei singoli tool
# ------------------------------------------------------------------
tools:
  dns:
    label: "DNS resolver"
    kind: builtin
    passive: true
    phase: 1
    timeout_seconds: 60
    coverage_areas: [email_dns_security, attack_surface]
    coverage_weight: 1.0

  rdap:
    label: "RDAP / whois pubblico"
    kind: builtin
    passive: true
    phase: 1
    timeout_seconds: 45
    coverage_areas: [email_dns_security]
    coverage_weight: 0.6

  certificate_transparency:
    label: "Certificate Transparency (crt.sh)"
    kind: builtin
    passive: true
    phase: 1
    timeout_seconds: 90
    coverage_areas: [attack_surface]
    coverage_weight: 0.9

  email_discovery:
    label: "Indirizzi e-mail da DNS"
    kind: builtin
    passive: true
    phase: 1
    timeout_seconds: 60
    coverage_areas: [darkweb_breach]
    coverage_weight: 0.6
    notes: >-
      Ricava gli indirizzi dell'organizzazione dai tag rua/ruf del record DMARC
      e dal campo RNAME del record SOA, e li affianca a quelli dichiarati nel
      perimetro. Alimenta la verifica sulle violazioni, che senza indirizzi non
      ha nulla da cercare. Gli indirizzi su domini di terzi (elaboratori DMARC,
      registrar) non vengono raccolti.

  email_harvest:
    label: "Indirizzi e-mail dal sito"
    kind: builtin
    passive: false
    phase: 1
    timeout_seconds: 180
    max_pages: 24
    max_page_bytes: 1000000
    coverage_areas: [darkweb_breach]
    coverage_weight: 1.0
    notes: >-
      Legge le pagine pubbliche dell'organizzazione — contatti, chi siamo,
      privacy — e ne estrae gli indirizzi e-mail. Sono quelli che compaiono
      nelle violazioni: le fonti DNS danno solo caselle tecniche, che nessuno
      usa per registrarsi da qualche parte. Non esplora il sito in profondita'
      e non segue link esterni. E' una richiesta ai sistemi
      dell'organizzazione, quindi fuori dal profilo passivo.

  ip_perimeter:
    label: "Perimetro IP pubblico"
    kind: builtin
    passive: true
    phase: 1
    timeout_seconds: 180
    coverage_areas: [attack_surface]
    coverage_weight: 0.9
    # Reverse DNS e RDAP sono interrogazioni a registri pubblici: nessun
    # contatto con i sistemi dell'organizzazione, quindi ammesso anche nel
    # profilo passivo. La classificazione che ne esce non autorizza nulla:
    # dice solo quali indirizzi ha senso proporre per una scansione attiva.
    notes: >-
      Arricchisce gli indirizzi raggiunti dai domini in perimetro con la rete
      RDAP e il reverse DNS, e distingue l'infrastruttura condivisa di un
      fornitore (CDN, reverse proxy) dalle istanze dell'organizzazione. Gli
      indirizzi su rete condivisa non sono mai bersaglio di scansione attiva.

  subfinder:
    label: "Subfinder"
    kind: external_binary
    binary: subfinder
    passive: true
    phase: 1
    timeout_seconds: 180
    max_targets: 25
    repository: "https://github.com/projectdiscovery/subfinder"
    license: "MIT"
    coverage_areas: [attack_surface]
    coverage_weight: 1.0
    args_template: ["-silent", "-json", "-all", "-d", "{domain}"]

  spiderfoot:
    label: "SpiderFoot"
    kind: http_api
    passive: true
    phase: 1
    timeout_seconds: 900
    repository: "https://github.com/smicallef/spiderfoot"
    license: "MIT"
    coverage_areas: [attack_surface, darkweb_breach]
    coverage_weight: 1.0
    # Moduli ammessi per profilo: nessun modulo attivo nel profilo passivo.
    # I moduli di raccolta indirizzi (sfp_skymem, sfp_emailformat, sfp_email)
    # devono precedere quelli sulle violazioni: sfp_psbdmp, sfp_ahmia e
    # sfp_haveibeenpwned lavorano sugli EMAILADDR prodotti dai primi. Senza i
    # raccoglitori i moduli sulle violazioni non ricevono alcun input e la
    # sezione dark web resta vuota anche quando l'esposizione esiste.
    modules:
      public_passive:
        - sfp_dnsresolve
        - sfp_crt
        - sfp_hackertarget
        - sfp_threatcrowd
        - sfp_whois
        - sfp_email
        - sfp_skymem
        - sfp_emailformat
        - sfp_psbdmp
        - sfp_haveibeenpwned
        - sfp_ahmia
        - sfp_similar
        - sfp_pastebin
      verified_standard:
        - sfp_dnsresolve
        - sfp_crt
        - sfp_hackertarget
        - sfp_whois
        - sfp_email
        - sfp_skymem
        - sfp_emailformat
        - sfp_psbdmp
        - sfp_haveibeenpwned
        - sfp_ahmia
        - sfp_similar
        - sfp_pastebin
        - sfp_webframework
      verified_extended:
        - sfp_dnsresolve
        - sfp_crt
        - sfp_whois
        - sfp_email
        - sfp_skymem
        - sfp_emailformat
        - sfp_psbdmp
        - sfp_haveibeenpwned
        - sfp_ahmia
        - sfp_similar
        - sfp_webframework
        - sfp_portscan_tcp
    forbidden_modules:
      - sfp_bruteforce
      - sfp_dnsbrute
      - sfp_tool_nmap
      - sfp_tool_nuclei
    notes: >-
      Alcune fonti usate da SpiderFoot richiedono API key a pagamento
      (sfp_haveibeenpwned, sfp_dehashed, sfp_hunter, sfp_intelx): senza key il
      modulo non produce eventi e non fa fallire la scansione. I moduli
      gratuiti su indirizzi e violazioni sono sfp_skymem, sfp_emailformat,
      sfp_psbdmp e sfp_ahmia. Le key sono gestite dal Connector registry,
      non hardcoded.

  checkdmarc:
    label: "checkdmarc"
    kind: python_library
    passive: true
    phase: 1
    timeout_seconds: 120
    repository: "https://github.com/domainaware/checkdmarc"
    license: "Apache-2.0"
    coverage_areas: [email_dns_security]
    coverage_weight: 1.0
    options:
      check_starttls_in_profiles: [verified_standard, verified_extended]
      dkim_selectors_default: [default, selector1, selector2, google, k1, mail, dkim, s1, s2]
      dkim_max_lookups: 12

  httpx:
    label: "HTTPX"
    kind: external_binary
    binary: httpx
    passive: false
    phase: 1
    timeout_seconds: 300
    max_targets: 500
    rate_limit_per_second: 20
    repository: "https://github.com/projectdiscovery/httpx"
    license: "MIT"
    coverage_areas: [web_security, attack_surface]
    coverage_weight: 1.0
    args_template: ["-json", "-silent", "-no-color", "-status-code", "-title",
                    "-tech-detect", "-web-server", "-cdn", "-tls-grab",
                    "-follow-redirects", "-max-redirects", "3", "-timeout", "10",
                    "-rate-limit", "20"]
    screenshot_profiles: [verified_standard, verified_extended]

  testssl:
    label: "testssl.sh"
    kind: external_binary
    binary: testssl.sh
    passive: false
    phase: 1
    # testssl.sh prova centinaia di combinazioni di cifrari e protocolli, un
    # host alla volta. Con venticinque host da dieci minuti l'analisi TLS da
    # sola supera le quattro ore e la scansione resta in corso senza che nulla
    # sia andato storto. `total_budget_seconds` e' il tetto complessivo dello
    # strumento: superato, gli host rimanenti sono dichiarati non verificati.
    timeout_seconds: 300
    total_budget_seconds: 900
    max_targets: 10
    repository: "https://github.com/testssl/testssl.sh"
    license: "GPL-2.0"
    license_risk: >-
      GPL-2.0: usato come strumento esterno invocato via subprocess,
      NON linkato. Nessuna redistribuzione modificata.
    coverage_areas: [web_security]
    coverage_weight: 1.0
    args_template: ["--jsonfile-pretty", "{outfile}", "--quiet", "--color", "0",
                    "--severity", "LOW", "--sneaky", "{target}"]

  ransomware_live:
    label: "Ransomware.live"
    kind: http_api
    passive: true
    phase: 1
    timeout_seconds: 60
    repository: "https://github.com/JMousqueton/ransomware.live"
    license: "AGPL-3.0 (progetto) / API pubblica"
    coverage_areas: [darkweb_breach]
    coverage_weight: 1.0
    base_url: "https://api.ransomware.live/v2"

  hibp:
    label: "Have I Been Pwned"
    kind: http_api
    passive: true
    optional: true
    requires_api_key: true
    commercial: true
    phase: 1
    timeout_seconds: 90
    coverage_areas: [darkweb_breach]
    coverage_weight: 0.8
    base_url: "https://haveibeenpwned.com/api/v3"
    notes: "Sorgente NON open source. Richiede subscription a pagamento."

  credential_exposure:
    label: "Credenziali esposte (dark web)"
    kind: http_api
    passive: true
    optional: true
    requires_api_key: true
    commercial: true
    phase: 1
    timeout_seconds: 120
    coverage_areas: [darkweb_breach]
    coverage_weight: 1.0
    base_url: ""
    notes: >-
      Connettore generico verso una fonte di intelligence su credenziali
      esposte: log di infostealer, combolist, paste e menzioni su canali
      chiusi. Le fonti serie in questo ambito sono tutte commerciali, quindi
      indirizzo e chiave si configurano. Nessuna password viene mai letta o
      memorizzata: della credenziale si registra solo l'esistenza, con
      l'identita' mascherata.

  xposedornot:
    label: "XposedOrNot (indirizzi e-mail in violazioni)"
    kind: http_api
    passive: true
    phase: 1
    timeout_seconds: 300
    coverage_areas: [darkweb_breach]
    coverage_weight: 1.0
    base_url: "https://api.xposedornot.com/v1"
    # La fonte e' gratuita e senza API key, ma limitata per indirizzo IP a
    # 2 richieste al secondo, 25 all'ora e 100 al giorno: oltre questi numeri
    # risponde 429. Da qui il tetto di indirizzi per scansione e la pausa.
    max_targets: 20
    seconds_between_requests: 0.6
    # L'oggetto della verifica e' l'indirizzo, non la credenziale: di ogni
    # violazione si conservano nome, anno, dimensione e categorie di dato.
    # Nessuna password viene mai letta.
    only_verified_domains: false
    notes: >-
      Fonte gratuita e senza registrazione per sapere quali indirizzi
      dell'organizzazione compaiono in violazioni di dati pubblicate.
      L'endpoint per dominio richiede invece una API key e la validazione
      del dominio sul portale della fonte: non e' usato.

  kev:
    label: "CISA Known Exploited Vulnerabilities"
    kind: http_feed
    passive: true
    phase: 1
    timeout_seconds: 120
    coverage_areas: [technical_vulnerabilities]
    coverage_weight: 0.7
    url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
    cache_ttl_hours: 24

  epss:
    label: "FIRST EPSS"
    kind: http_api
    passive: true
    phase: 1
    timeout_seconds: 120
    coverage_areas: [technical_vulnerabilities]
    coverage_weight: 0.6
    base_url: "https://api.first.org/data/v1/epss"
    cache_ttl_hours: 24

  amass_passive:
    label: "OWASP Amass (passive)"
    kind: external_binary
    binary: amass
    passive: true
    phase: 2
    timeout_seconds: 900
    repository: "https://github.com/owasp-amass/amass"
    license: "Apache-2.0"
    coverage_areas: [attack_surface]
    coverage_weight: 1.0
    args_template: ["enum", "-passive", "-nocolor", "-json", "{outfile}", "-d", "{domain}"]

  amass:
    label: "OWASP Amass"
    kind: external_binary
    binary: amass
    passive: false
    phase: 2
    timeout_seconds: 1800
    repository: "https://github.com/owasp-amass/amass"
    license: "Apache-2.0"
    coverage_areas: [attack_surface]
    coverage_weight: 1.0

  zap_baseline:
    label: "OWASP ZAP Baseline"
    kind: docker
    passive: false
    phase: 2
    timeout_seconds: 900
    max_targets: 10
    image: "ghcr.io/zaproxy/zaproxy:stable"
    license: "Apache-2.0"
    coverage_areas: [web_security]
    coverage_weight: 1.0
    args_template: ["zap-baseline.py", "-t", "{url}", "-J", "{outfile}", "-I", "-m", "3"]
    forbidden_modes: [full_scan, active_scan, api_scan_active]

  nuclei:
    label: "Nuclei"
    kind: external_binary
    binary: nuclei
    passive: false
    phase: 2
    timeout_seconds: 1200
    max_targets: 100
    rate_limit_per_second: 20
    repository: "https://github.com/projectdiscovery/nuclei"
    license: "MIT (engine) / template license separata"
    coverage_areas: [technical_vulnerabilities, web_security]
    coverage_weight: 1.0
    template_allowlist_file: "config/nuclei_allowlist.yaml"
    excluded_tags: [dos, fuzz, brute-force, intrusive, rce, sqli, file-upload,
                    auth-bypass-active, headless, network-dos, exploit]

  naabu:
    label: "Naabu"
    kind: external_binary
    binary: naabu
    passive: false
    phase: 2
    timeout_seconds: 900
    rate_limit_per_second: 100
    repository: "https://github.com/projectdiscovery/naabu"
    license: "MIT"
    coverage_areas: [attack_surface]
    coverage_weight: 1.0
    default_ports: [21,22,23,25,53,80,110,135,139,143,443,445,465,587,993,995,
                    1433,1723,3306,3389,4443,5432,5900,5985,6379,8000,8080,8443,
                    8888,9200,9300,10000,27017]

  port_scan:
    label: "Rilevazione servizi TCP"
    kind: builtin
    passive: false
    phase: 2
    timeout_seconds: 900
    rate_limit_per_second: 100
    max_concurrency: 32
    connect_timeout_seconds: 2.0
    coverage_areas: [attack_surface]
    coverage_weight: 1.0
    default_ports: [21,22,23,25,53,80,110,135,139,143,443,445,465,587,993,995,
                    1433,1723,3306,3389,4443,5432,5900,5985,6379,8000,8080,8443,
                    8888,9200,9300,10000,27017]
    notes: >-
      Alternativa a Naabu che non richiede binari nativi: connessione TCP
      completa, nessun raw socket, nessun privilegio speciale. Serve perche'
      Naabu non pubblica binari per linux/arm64 e sulle macchine Apple Silicon
      il port scanning non partiva mai. Gira solo quando Naabu non e' presente:
      i due strumenti fanno la stessa cosa e le loro evidenze convergono sulla
      stessa impronta.

  nmap:
    label: "Nmap"
    kind: external_binary
    binary: nmap
    passive: false
    phase: 2
    timeout_seconds: 1800
    license: "NPSL (Nmap Public Source License) - verificare uso commerciale"
    license_risk: >-
      Nmap non e' GPL puro: la NPSL limita la redistribuzione in prodotti
      commerciali. Preferire Naabu nel prodotto distribuito.
    coverage_areas: [attack_surface]
    coverage_weight: 0.9
    args_template: ["-sT", "-Pn", "-n", "--open", "-T2", "--max-retries", "1",
                    "-oX", "{outfile}"]

  dnstwist_passive:
    label: "DNSTwist (solo registrati)"
    kind: python_library
    passive: true
    phase: 2
    timeout_seconds: 600
    repository: "https://github.com/elceef/dnstwist"
    license: "Apache-2.0"
    coverage_areas: [darkweb_breach]
    coverage_weight: 0.8

  dnstwist:
    label: "DNSTwist"
    kind: python_library
    passive: true
    phase: 2
    timeout_seconds: 900
    repository: "https://github.com/elceef/dnstwist"
    license: "Apache-2.0"
    coverage_areas: [darkweb_breach]
    coverage_weight: 1.0

  email_header:
    label: "Email header analyzer"
    kind: builtin
    passive: true
    phase: 2
    timeout_seconds: 30
    coverage_areas: [email_dns_security]
    coverage_weight: 0.7

  ail:
    label: "AIL Framework"
    kind: http_api
    passive: true
    phase: 3
    optional: true
    timeout_seconds: 600
    repository: "https://github.com/ail-project/ail-framework"
    license: "AGPL-3.0"
    license_risk: >-
      AGPL-3.0: usato come servizio esterno separato via API di rete.
      Nessun linking nel codice Defenix.
    coverage_areas: [darkweb_breach]
    coverage_weight: 1.0
    requires_tor_network: true

# Limiti globali di sicurezza applicati dal worker a QUALSIASI tool.
global_limits:
  max_targets_per_run: 500
  max_output_bytes: 52428800        # 50 MB
  max_wall_clock_seconds: 3600
  max_concurrent_tool_runs: 4
  process_memory_limit_mb: 2048
  process_cpu_seconds: 3000
  temp_dir_quota_mb: 512
