# Catalogo standard delle remediation.
# `commercial_services` e' SEPARATO dalla raccomandazione tecnica: nel report
# viene reso in una sezione distinta, mai mescolato al finding tecnico.
version: "1.0.0"

effort_scale: [xs, s, m, l, xl]
priority_scale: [p1, p2, p3, p4]

remediations:
  - id: REM-EMAIL-DMARC
    title_it: "Implementare e irrigidire DMARC"
    title_en: "Implement and enforce DMARC"
    area: email_dns_security
    priority: p1
    effort: s
    skills: ["Sistemista DNS", "Amministratore posta"]
    risk_mitigated_it: >-
      Spoofing del dominio aziendale, phishing verso clienti e dipendenti,
      Business Email Compromise.
    immediate_action_it: >-
      Pubblicare un record TXT `_dmarc.<dominio>` con `p=none` e destinatari
      `rua=` per iniziare la raccolta dei report aggregati.
    structural_solution_it: >-
      Analizzare i report per 4-8 settimane, allineare tutte le sorgenti di
      invio legittime (SPF+DKIM), quindi passare a `p=quarantine` e infine
      `p=reject` con `sp=reject` e `pct=100`.
    verification_it: >-
      Il record `_dmarc.<dominio>` risolve, la policy e' `reject` o
      `quarantine`, i report aggregati non mostrano piu' sorgenti non allineate.
    references:
      - "RFC 7489"
      - "NIST SP 800-177 Rev.1"
      - "AgID - Linee guida sicurezza posta elettronica"
    commercial_services: ["Defenix Email Security Assessment", "AD Consulting DMARC onboarding"]

  - id: REM-EMAIL-SPF
    title_it: "Correggere il record SPF"
    title_en: "Fix the SPF record"
    area: email_dns_security
    priority: p1
    effort: xs
    skills: ["Sistemista DNS"]
    risk_mitigated_it: "Invio di e-mail fraudolente a nome del dominio."
    immediate_action_it: >-
      Mantenere un unico record SPF valido, terminato con `-all` o `~all`.
    structural_solution_it: >-
      Censire tutte le sorgenti di invio legittime, rimuovere gli include
      obsoleti, mantenere il numero di lookup DNS entro 10 usando appiattimento
      controllato o sottodomini dedicati.
    verification_it: "Un solo record SPF, sintassi valida, lookup <= 10, meccanismo finale restrittivo."
    references: ["RFC 7208"]
    commercial_services: ["Defenix Email Security Assessment"]

  - id: REM-EMAIL-DKIM
    title_it: "Attivare la firma DKIM"
    title_en: "Enable DKIM signing"
    area: email_dns_security
    priority: p2
    effort: s
    skills: ["Amministratore posta"]
    risk_mitigated_it: "Manomissione dei messaggi e impossibilita' di allineamento DMARC."
    immediate_action_it: "Attivare la firma DKIM sul provider di posta e pubblicare la chiave pubblica."
    structural_solution_it: >-
      Chiavi RSA >= 2048 bit o Ed25519, rotazione periodica documentata,
      selettori distinti per ciascun sistema di invio.
    verification_it: "Il selettore risolve e i messaggi in uscita passano la verifica DKIM con allineamento."
    references: ["RFC 6376"]
    commercial_services: []

  - id: REM-EMAIL-MTASTS
    title_it: "Configurare MTA-STS e TLS-RPT"
    title_en: "Configure MTA-STS and TLS-RPT"
    area: email_dns_security
    priority: p3
    effort: s
    skills: ["Sistemista DNS", "Amministratore posta"]
    risk_mitigated_it: "Downgrade attack sulla consegna SMTP e intercettazione della posta."
    immediate_action_it: "Pubblicare `_mta-sts` e il policy file in modalita' `testing`."
    structural_solution_it: "Passare la policy a `enforce` dopo la validazione dei report TLS-RPT."
    verification_it: "Policy MTA-STS raggiungibile in HTTPS, modalita' enforce, report TLS-RPT ricevuti."
    references: ["RFC 8461", "RFC 8460"]
    commercial_services: []

  - id: REM-EMAIL-STARTTLS
    title_it: "Abilitare STARTTLS sui server di posta"
    title_en: "Enable STARTTLS on mail servers"
    area: email_dns_security
    priority: p2
    effort: s
    skills: ["Amministratore posta"]
    risk_mitigated_it: "Trasmissione della posta in chiaro tra MTA."
    immediate_action_it: "Abilitare STARTTLS con certificato valido su tutti gli MX."
    structural_solution_it: "TLS 1.2+ con cipher moderni, certificati rinnovati automaticamente, DANE/TLSA se DNSSEC attivo."
    verification_it: "Tutti gli MX negoziano STARTTLS con certificato valido e protocollo >= TLS 1.2."
    references: ["RFC 3207"]
    commercial_services: []

  - id: REM-DNS-DNSSEC
    title_it: "Abilitare DNSSEC"
    title_en: "Enable DNSSEC"
    area: email_dns_security
    priority: p3
    effort: m
    skills: ["Sistemista DNS"]
    risk_mitigated_it: "Cache poisoning e dirottamento della risoluzione DNS."
    immediate_action_it: "Verificare il supporto DNSSEC del registrar e del provider DNS."
    structural_solution_it: "Firmare la zona, pubblicare i record DS presso il registrar, monitorare la rotazione delle chiavi."
    verification_it: "La catena di fiducia DNSSEC valida correttamente dalla root alla zona."
    references: ["RFC 4033"]
    commercial_services: []

  - id: REM-DNS-CAA
    title_it: "Pubblicare record CAA"
    title_en: "Publish CAA records"
    area: email_dns_security
    priority: p4
    effort: xs
    skills: ["Sistemista DNS"]
    risk_mitigated_it: "Emissione non autorizzata di certificati per il dominio."
    immediate_action_it: "Pubblicare un record CAA che elenchi solo le CA autorizzate."
    structural_solution_it: "Aggiungere `iodef` per la notifica dei tentativi di emissione non conformi."
    verification_it: "Il record CAA risolve e contiene esclusivamente le CA in uso."
    references: ["RFC 8659"]
    commercial_services: []

  - id: REM-DNS-EXPIRY
    title_it: "Rinnovare il dominio e proteggerne il ciclo di vita"
    title_en: "Renew the domain and protect its lifecycle"
    area: email_dns_security
    priority: p1
    effort: xs
    skills: ["Referente amministrativo", "Sistemista DNS"]
    risk_mitigated_it: "Perdita del dominio, dirottamento della posta e del sito."
    immediate_action_it: "Rinnovare immediatamente il dominio in scadenza."
    structural_solution_it: "Attivare auto-renew, registrar lock e alert su scadenza a 90/60/30 giorni."
    verification_it: "Data di scadenza spostata, registrar lock attivo, auto-renew abilitato."
    references: []
    commercial_services: []

  - id: REM-WEB-HTTPS
    title_it: "Forzare HTTPS su tutti i servizi web"
    title_en: "Enforce HTTPS on all web services"
    area: web_security
    priority: p1
    effort: s
    skills: ["Sistemista web"]
    risk_mitigated_it: "Intercettazione delle credenziali e manipolazione dei contenuti."
    immediate_action_it: "Attivare il certificato TLS e il redirect 301 da HTTP a HTTPS."
    structural_solution_it: "HSTS con max-age >= 31536000, eliminazione del mixed content, rinnovo automatico dei certificati."
    verification_it: "HTTP reindirizza a HTTPS, HSTS presente, nessuna risorsa in chiaro nella pagina."
    references: ["OWASP Transport Layer Security Cheat Sheet"]
    commercial_services: []

  - id: REM-TLS-CERT
    title_it: "Gestire correttamente i certificati TLS"
    title_en: "Manage TLS certificates properly"
    area: web_security
    priority: p1
    effort: s
    skills: ["Sistemista web"]
    risk_mitigated_it: "Errori di fiducia nel browser, interruzione di servizio, phishing agevolato."
    immediate_action_it: "Sostituire i certificati scaduti o con hostname non corrispondente."
    structural_solution_it: "Automatizzare l'emissione (ACME), monitorare le scadenze, allineare SAN e hostname pubblicati."
    verification_it: "Certificato valido, catena completa, scadenza > 30 giorni, hostname incluso nelle SAN."
    references: []
    commercial_services: ["Defenix Certificate Monitoring"]

  - id: REM-TLS-HARDENING
    title_it: "Hardening della configurazione TLS"
    title_en: "TLS configuration hardening"
    area: web_security
    priority: p2
    effort: s
    skills: ["Sistemista web"]
    risk_mitigated_it: "Downgrade, attacchi su cipher deboli, decrittazione del traffico."
    immediate_action_it: "Disabilitare SSLv3, TLS 1.0 e TLS 1.1 e i cipher suite deboli."
    structural_solution_it: "Adottare un profilo TLS 1.2/1.3 moderno, forward secrecy, OCSP stapling, revisione periodica."
    verification_it: "Solo TLS 1.2/1.3 negoziabili, nessun cipher NULL/RC4/3DES/EXPORT."
    references: ["Mozilla TLS Configuration - Intermediate"]
    commercial_services: []

  - id: REM-WEB-HEADERS
    title_it: "Implementare gli header di sicurezza HTTP"
    title_en: "Implement HTTP security headers"
    area: web_security
    priority: p2
    effort: s
    skills: ["Sviluppatore web", "Sistemista web"]
    risk_mitigated_it: "Cross-site scripting, clickjacking, MIME sniffing, leakage del referrer."
    immediate_action_it: >-
      Aggiungere `Strict-Transport-Security`, `X-Content-Type-Options: nosniff`,
      `Referrer-Policy` e una protezione clickjacking.
    structural_solution_it: >-
      Definire una Content Security Policy in report-only, analizzarne le
      violazioni e passarla in enforcement; centralizzare gli header su reverse
      proxy o WAF.
    verification_it: "Gli header sono presenti su tutte le risposte e la CSP e' in enforcement senza violazioni legittime."
    references: ["OWASP Secure Headers Project"]
    commercial_services: []

  - id: REM-WEB-COOKIES
    title_it: "Proteggere i cookie di sessione"
    title_en: "Harden session cookies"
    area: web_security
    priority: p2
    effort: xs
    skills: ["Sviluppatore web"]
    risk_mitigated_it: "Furto di sessione e attacchi CSRF."
    immediate_action_it: "Impostare `Secure`, `HttpOnly` e `SameSite` sui cookie di sessione."
    structural_solution_it: "Rivedere durata, scope e rotazione dei cookie; separare cookie funzionali e di sessione."
    verification_it: "Tutti i cookie di sessione riportano Secure, HttpOnly e SameSite=Lax o Strict."
    references: ["OWASP Session Management Cheat Sheet"]
    commercial_services: []

  - id: REM-WEB-CORS
    title_it: "Restringere la configurazione CORS"
    title_en: "Restrict CORS configuration"
    area: web_security
    priority: p2
    effort: s
    skills: ["Sviluppatore web"]
    risk_mitigated_it: "Accesso cross-origin non autorizzato ai dati applicativi."
    immediate_action_it: "Rimuovere `Access-Control-Allow-Origin: *` dagli endpoint autenticati."
    structural_solution_it: "Allowlist esplicita di origin, nessun wildcard con credenziali, revisione per endpoint."
    verification_it: "Nessun endpoint autenticato risponde con origin wildcard."
    references: []
    commercial_services: []

  - id: REM-WEB-INFOLEAK
