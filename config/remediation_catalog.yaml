  - id: REM-IR-RANSOMWARE
    title_it: "Attivare la gestione dell'incidente ransomware"
    title_en: "Activate ransomware incident response"
    area: darkweb_breach
    priority: p1
    effort: xl
    skills: ["Incident Response", "Legale", "Data Protection Officer"]
    risk_mitigated_it: "Prosecuzione della compromissione, ulteriore esfiltrazione, sanzioni per mancata notifica."
    immediate_action_it: >-
      Attivare il piano di risposta agli incidenti, isolare i sistemi coinvolti,
      valutare gli obblighi di notifica (GDPR art. 33/34, NIS2 dove applicabile).
    structural_solution_it: >-
      Analisi forense della compromissione, ricostruzione del vettore iniziale,
      rotazione completa delle credenziali, revisione dei backup e del piano di continuita'.
    verification_it: "Incidente chiuso con relazione forense, vettore iniziale rimediato, monitoraggio rafforzato attivo."
    references: ["GDPR art. 33-34", "NIS2", "NIST SP 800-61"]
    commercial_services: ["Defenix Incident Response", "AD Consulting DFIR retainer"]

  - id: REM-CRED-ROTATION
    title_it: "Rotazione credenziali e analisi degli account compromessi"
    title_en: "Credential rotation and compromised account analysis"
    area: darkweb_breach
    priority: p1
    effort: m
    skills: ["Identity Administrator", "Security Analyst"]
    risk_mitigated_it: "Riutilizzo di credenziali esposte per accessi non autorizzati e BEC."
    immediate_action_it: >-
      Forzare il reset delle password degli account coinvolti, invalidare le
      sessioni attive e i token, verificare le regole di inoltro della posta.
    structural_solution_it: >-
      MFA obbligatoria su tutti gli accessi esterni, password policy conforme a
      NIST SP 800-63B, monitoraggio continuo delle credenziali esposte, EDR sugli
      endpoint per contrastare gli infostealer.
    verification_it: "Password ruotate, MFA attiva, nessun accesso anomalo nei log, nessuna regola di inoltro sospetta."
    references: ["NIST SP 800-63B"]
    commercial_services: ["Defenix Credential Monitoring", "AD Consulting Identity Security"]

