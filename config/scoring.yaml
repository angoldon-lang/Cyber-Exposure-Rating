# Defenix Exposure Rating - Deterministic scoring model
# ---------------------------------------------------------------
# Questo file e' l'UNICA fonte di verita' per il calcolo del rating.
# L'AI NON puo' modificare punteggi: interpreta soltanto il risultato.
# Ogni modifica richiede un bump di `version` e un test di regressione.
version: "1.0.0"
model_name: "Defenix Exposure Rating"

# Ogni categoria parte da 100 e subisce detrazioni.
categories:
  attack_surface:
    label_it: "Attack surface e servizi esposti"
    label_en: "Attack surface and exposed services"
    weight: 0.20
  technical_vulnerabilities:
    label_it: "Vulnerabilita' tecniche"
    label_en: "Technical vulnerabilities"
    weight: 0.25
  web_security:
    label_it: "Sicurezza dei siti web"
    label_en: "Web security"
    weight: 0.20
  email_dns_security:
    label_it: "Sicurezza e-mail e DNS"
    label_en: "Email and DNS security"
    weight: 0.20
  darkweb_breach:
    label_it: "Dark web, breach e impersonificazione"
    label_en: "Dark web, breach and impersonation"
    weight: 0.15

# Moltiplicatori applicati alla detrazione in funzione della classe di evidenza.
confidence_multipliers:
  confirmed: 1.0
  probable: 0.5
  inferred: 0.0
  informational: 0.0
  false_positive: 0.0
  accepted_risk: 0.0
  resolved: 0.0

# Ownership: solo asset verificati pesano al 100%.
ownership_multipliers:
  verified_owned: 1.0
  likely_owned: 0.5
  unverified: 0.0
  third_party: 0.0
  excluded: 0.0

# Decadimento temporale: le detrazioni invecchiano (half_life in giorni).
# `none` = nessun decadimento.
temporal_decay:
  default:
    mode: none
  breach_old:
    mode: half_life
    half_life_days: 540
    floor: 0.10
  breach_recent:
    mode: half_life
    half_life_days: 365
    floor: 0.25
  stealer_log:
    mode: half_life
    half_life_days: 180
    floor: 0.40
  ransomware_post:
    mode: half_life
    half_life_days: 730
    floor: 0.50

classes:
  - {code: "A", min: 85, max: 100, label_it: "Esposizione contenuta",      label_en: "Contained exposure"}
  - {code: "B", min: 70, max: 84,  label_it: "Miglioramenti necessari",    label_en: "Improvements required"}
  - {code: "C", min: 55, max: 69,  label_it: "Esposizione significativa",  label_en: "Significant exposure"}
  - {code: "D", min: 40, max: 54,  label_it: "Rischio elevato",            label_en: "High risk"}
  - {code: "E", min: 0,  max: 39,  label_it: "Esposizione critica",        label_en: "Critical exposure"}

# Soglia sotto la quale non si pubblica un rating definitivo.
minimum_confidence_for_rating: 50

# ---------------------------------------------------------------
# REGOLE DI DETRAZIONE
# ---------------------------------------------------------------
# campi:
#   id                : identificativo stabile (usato dai test e dall'audit)
#   category          : una delle categorie sopra
#   match             : criterio di matching sulle evidenze normalizzate
#   severity          : critical|high|medium|low|info
#   deduction         : punti sottratti alla categoria per occorrenza
#   max_deduction     : tetto massimo cumulativo per questa regola
#   min_confidence    : classe minima di evidenza che attiva la detrazione
#   required_ownership: ownership minima richiesta
#   dedup_key         : campi che definiscono l'unicita' dell'occorrenza
#   exclusive_group   : all'interno del gruppo, per uno stesso finding si applica
#                       SOLO la regola con la detrazione piu' alta (evita che una
#                       stessa CVE venga penalizzata da piu' regole sovrapposte)
#   root_cause_group  : le regole dello stesso gruppo condividono un tetto
#   decay             : profilo di decadimento temporale
#   remediation       : id nel remediation_catalog
