[pytest]
testpaths = tests
python_files = test_*.py
python_classes =
python_functions = test_*
addopts = -q --strict-markers --tb=short
markers =
    security: test delle protezioni (scope, injection, RBAC, multi-tenant)
    scoring: test del motore di scoring deterministico
    slow: test piu' lenti (generazione report)
filterwarnings =
    ignore::DeprecationWarning
