# ---------------------------------------------------------------------------
# Defenix Exposure Rating - stack di sviluppo e installazioni di piccole
# dimensioni. Le versioni delle immagini sono bloccate.
#
# Separazione delle reti:
#   backend  - API, database, coda, worker
#   frontend - solo interfaccia web e API
#   tor      - rete dedicata agli strumenti che usano Tor (fase 3)
# ---------------------------------------------------------------------------

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-common-env: &common-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-defenix}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obbligatoria}@postgres:5432/${POSTGRES_DB:-defenix}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  ENVIRONMENT: ${ENVIRONMENT:-development}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY obbligatoria}
  AUTH_MODE: ${AUTH_MODE:-local}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  SCAN_MOCK_MODE: ${SCAN_MOCK_MODE:-true}
  ALLOW_PRIVATE_IP_SCANNING: "false"
  EVIDENCE_STORAGE_PATH: /var/lib/defenix/evidence
  REPORT_STORAGE_PATH: /var/lib/defenix/reports
  CONFIG_DIR: /srv/config
  HIBP_API_KEY: ${HIBP_API_KEY:-}
  SPIDERFOOT_URL: ${SPIDERFOOT_URL:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-defenix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obbligatoria}
      POSTGRES_DB: ${POSTGRES_DB:-defenix}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-defenix} -d ${POSTGRES_DB:-defenix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *logging

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --maxmemory 512mb
      --maxmemory-policy allkeys-lru --save 900 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]
    logging: *logging

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *common-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - evidence-data:/var/lib/defenix/evidence
      - report-data:/var/lib/defenix/reports
    ports:
      - "${API_PORT:-8000}:8000"
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
    logging: *logging

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      SCAN_MAX_CONCURRENT_TOOLS: "4"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - evidence-data:/var/lib/defenix/evidence
      - report-data:/var/lib/defenix/reports
    networks: [backend]
    # Il worker esegue strumenti esterni: filesystem temporaneo dedicato,
    # nessun privilegio aggiuntivo, limiti di risorse espliciti.
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # NET_RAW serve soltanto al SYN scan di naabu nel profilo esteso.
    # Rimuovere questa capability se il profilo esteso non viene usato.
    cap_add: [NET_RAW]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    logging: *logging

  beat:
    build:
      context: .
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    environment: *common-env
    depends_on:
      redis: { condition: service_healthy }
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  # --- Servizi opzionali -------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: ["oidc"]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      # Compose interpola l'intero file a prescindere dai profili attivi: un
      # `:?` qui bloccherebbe anche chi non usa OIDC. Il controllo e' nel
      # target `make up-oidc`, che rifiuta di partire senza password.
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-defenix}
      KC_DB_USERNAME: ${POSTGRES_USER:-defenix}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend, frontend]
    logging: *logging

  spiderfoot:
    image: ghcr.io/smicallef/spiderfoot:v4.0
    profiles: ["osint"]
    restart: unless-stopped
    ports:
      - "${SPIDERFOOT_PORT:-5001}:5001"
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging: *logging

  # Rete separata per gli strumenti che usano Tor (AIL Framework, fase 3).
  tor-proxy:
    image: dperson/torproxy:latest
    profiles: ["tor"]
    restart: unless-stopped
    networks: [tor]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  evidence-data:
  report-data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
  tor:
    driver: bridge
