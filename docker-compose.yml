# ---------------------------------------------------------------------------
# Defenix Security Rating - stack di sviluppo e installazioni di piccole
# dimensioni. Le versioni delle immagini sono bloccate.
#
# Separazione delle reti:
#   backend  - API, database, coda, worker
#   frontend - solo interfaccia web e API
#   tor      - rete dedicata agli strumenti che usano Tor (fase 3)
# ---------------------------------------------------------------------------

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-common-env: &common-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-defenix}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obbligatoria}@postgres:5432/${POSTGRES_DB:-defenix}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  ENVIRONMENT: ${ENVIRONMENT:-development}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY obbligatoria}
  DEMO_CREDENTIALS_PATH: /var/lib/defenix/state/.demo-credentials.json
  AUTH_MODE: ${AUTH_MODE:-local}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  SCAN_MOCK_MODE: ${SCAN_MOCK_MODE:-true}
  ALLOW_PRIVATE_IP_SCANNING: "false"
  EVIDENCE_STORAGE_PATH: /var/lib/defenix/evidence
  REPORT_STORAGE_PATH: /var/lib/defenix/reports
  CONFIG_DIR: /srv/config
  # Tutte le variabili dell'elenco configurabile (app/services/tool_config.py)
  # vanno passate qui, altrimenti il valore scritto in `.env` non raggiunge il
  # worker e lo strumento resta «non configurato» per sempre, qualunque cosa si
  # scriva nel file. Cinque di queste sette mancavano, e theHarvester non e'
  # mai stato configurabile da `.env` da quando esiste. Un test ora verifica
  # che i quattro posti -- questo blocco, Settings, l'elenco e `.env.example`
  # -- dicano la stessa cosa.
  HIBP_API_KEY: ${HIBP_API_KEY:-}
  SPIDERFOOT_URL: ${SPIDERFOOT_URL:-}
  THEHARVESTER_URL: ${THEHARVESTER_URL:-}
  THEHARVESTER_API_KEY: ${THEHARVESTER_API_KEY:-}
  ZAP_URL: ${ZAP_URL:-}
  ZAP_API_KEY: ${ZAP_API_KEY:-}
  CREDENTIAL_EXPOSURE_URL: ${CREDENTIAL_EXPOSURE_URL:-}
  CREDENTIAL_EXPOSURE_API_KEY: ${CREDENTIAL_EXPOSURE_API_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-defenix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obbligatoria}
      POSTGRES_DB: ${POSTGRES_DB:-defenix}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-defenix} -d ${POSTGRES_DB:-defenix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *logging

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --maxmemory 512mb
      --maxmemory-policy allkeys-lru --save 900 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]
    logging: *logging

  api:
    # Tutto `.env` arriva al contenitore, non solo le variabili elencate in
    # `x-common-env`. Diciassette impostazioni che l'applicazione legge erano
    # in `.env.example` e non venivano passate: chi le modificava non otteneva
    # nulla, e fra queste c'era EVIDENCE_ENCRYPTION_KEY -- la cifratura delle
    # evidenze a riposo era quindi spenta e non attivabile. Elencarle a mano
    # significa dimenticarne una ogni volta che se ne aggiunge una.
    #
    # Le voci di `environment` hanno la precedenza su `env_file`, quindi i
    # valori imposti qui (ALLOW_PRIVATE_IP_SCANNING, i percorsi, gli indirizzi
    # dei servizi interni) restano quelli e non si possono sovrascrivere da
    # `.env`.
    env_file:
      - path: .env
        # `required: false` perche' il file non deve essere obbligatorio per
        # LEGGERE il progetto: senza, `docker compose config` -- la
        # validazione, i test, la diagnosi -- non si carica piu' dove `.env`
        # non c'e'. Che serva per AVVIARE lo stack lo controlla `require-env`,
        # che sa anche dire quale segreto manca e come rimetterlo.
        required: false
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *common-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - evidence-data:/var/lib/defenix/evidence
      - report-data:/var/lib/defenix/reports
      # Il container gira in sola lettura: `seed` ha bisogno di un punto
      # scrivibile e persistente per il file delle credenziali dimostrative.
      - state-data:/var/lib/defenix/state
    ports:
      - "${API_PORT:-8000}:8000"
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
    logging: *logging

  worker:
    # Tutto `.env` arriva al contenitore, non solo le variabili elencate in
    # `x-common-env`. Diciassette impostazioni che l'applicazione legge erano
    # in `.env.example` e non venivano passate: chi le modificava non otteneva
    # nulla, e fra queste c'era EVIDENCE_ENCRYPTION_KEY -- la cifratura delle
    # evidenze a riposo era quindi spenta e non attivabile. Elencarle a mano
    # significa dimenticarne una ogni volta che se ne aggiunge una.
    #
    # Le voci di `environment` hanno la precedenza su `env_file`, quindi i
    # valori imposti qui (ALLOW_PRIVATE_IP_SCANNING, i percorsi, gli indirizzi
    # dei servizi interni) restano quelli e non si possono sovrascrivere da
    # `.env`.
    env_file:
      - path: .env
        # `required: false` perche' il file non deve essere obbligatorio per
        # LEGGERE il progetto: senza, `docker compose config` -- la
        # validazione, i test, la diagnosi -- non si carica piu' dove `.env`
        # non c'e'. Che serva per AVVIARE lo stack lo controlla `require-env`,
        # che sa anche dire quale segreto manca e come rimetterlo.
        required: false
    build:
      context: .
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      SCAN_MAX_CONCURRENT_TOOLS: "4"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - evidence-data:/var/lib/defenix/evidence
      - report-data:/var/lib/defenix/reports
      # La cache dei feed (CISA KEV, EPSS) deve sopravvivere al riavvio: stava
      # in /tmp, che qui sotto e' un tmpfs, quindi si svuotava ogni volta e il
      # catalogo veniva riscaricato molto piu' spesso del TTL di 24 ore --
      # moltiplicando le occasioni di incontrare un guasto di rete.
      - feed-cache:/var/lib/defenix/feeds
    networks: [backend]
    # Il worker esegue strumenti esterni: filesystem temporaneo dedicato,
    # nessun privilegio aggiuntivo, limiti di risorse espliciti.
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # NET_RAW serve soltanto al SYN scan di naabu nel profilo esteso.
    # Rimuovere questa capability se il profilo esteso non viene usato.
    cap_add: [NET_RAW]
    # Tetto ai processi del contenitore. E' qui e non fra i limiti del
    # singolo strumento perche' RLIMIT_NPROC conta i thread dell'utente su
    # tutto il contenitore, non quelli del processo a cui lo si applica:
    # usato per strumento uccideva i binari Go appena due scansioni
    # giravano insieme. Questo e' un limite del cgroup, vale per tutti e
    # dall'interno non si alza.
    #
    # Il valore e' ripetuto in due posti perche' per Compose sono lo stesso
    # campo, e dalla 5.x rifiuta il progetto se non coincidono: con il solo
    # `pids_limit` legge «non impostato» nei limiti del deploy e si ferma con
    # «can't set distinct values on 'pids_limit' and
    # 'deploy.resources.limits.pids'». Scrivendolo in entrambi, qualunque dei
    # due il motore legga, legge 4096. Un test verifica che restino uguali.
    pids_limit: 4096
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G, pids: 4096 }
    logging: *logging

  beat:
    # Tutto `.env` arriva al contenitore, non solo le variabili elencate in
    # `x-common-env`. Diciassette impostazioni che l'applicazione legge erano
    # in `.env.example` e non venivano passate: chi le modificava non otteneva
    # nulla, e fra queste c'era EVIDENCE_ENCRYPTION_KEY -- la cifratura delle
    # evidenze a riposo era quindi spenta e non attivabile. Elencarle a mano
    # significa dimenticarne una ogni volta che se ne aggiunge una.
    #
    # Le voci di `environment` hanno la precedenza su `env_file`, quindi i
    # valori imposti qui (ALLOW_PRIVATE_IP_SCANNING, i percorsi, gli indirizzi
    # dei servizi interni) restano quelli e non si possono sovrascrivere da
    # `.env`.
    env_file:
      - path: .env
        # `required: false` perche' il file non deve essere obbligatorio per
        # LEGGERE il progetto: senza, `docker compose config` -- la
        # validazione, i test, la diagnosi -- non si carica piu' dove `.env`
        # non c'e'. Che serva per AVVIARE lo stack lo controlla `require-env`,
        # che sa anche dire quale segreto manca e come rimetterlo.
        required: false
    build:
      context: .
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    environment: *common-env
    depends_on:
      redis: { condition: service_healthy }
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  # --- Servizi opzionali -------------------------------------------------
  # OWASP ZAP in modalita' demone. Sta qui, non dentro il worker: avviare
  # contenitori dal worker richiederebbe il socket Docker al suo interno, che
  # equivale al root sull'host — un contenitore che esegue scansioni non deve
  # poterlo fare. Il worker lo comanda via API, come fa con SpiderFoot.
  #
  # Profilo dedicato: e' un contenitore pesante e serve solo al profilo
  # Verified Extended. Si avvia con `make up-zap`.
  #
  # `:-` e non `:?` sulla chiave: Compose interpola l'intero file a
  # prescindere dai profili attivi, e un `:?` qui bloccherebbe l'avvio anche
  # a chi ZAP non lo usa. Il controllo sta in `make up-zap`, che rifiuta di
  # partire senza chiave.
  zap:
    image: ghcr.io/zaproxy/zaproxy:20260807-stable
    profiles: ["zap"]
    restart: unless-stopped
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.key=${ZAP_API_KEY:-}
      -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    # Nessuna porta pubblicata: ci parla solo il worker, sulla rete interna.
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    logging: *logging


  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: ["oidc"]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      # Compose interpola l'intero file a prescindere dai profili attivi: un
      # `:?` qui bloccherebbe anche chi non usa OIDC. Il controllo e' nel
      # target `make up-oidc`, che rifiuta di partire senza password.
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-defenix}
      KC_DB_USERNAME: ${POSTGRES_USER:-defenix}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend, frontend]
    logging: *logging

  # theHarvester: enumera indirizzi e-mail e sottodomini da fonti pubbliche.
  # Contenitore a se' e non binario nell'immagine dei worker: richiede Python
  # 3.12 (i worker girano su 3.11) e pinna httpx, fastapi e playwright a
  # versioni che confliggono con quelle dell'applicazione.
  #
  # L'immagine e' fissata per digest e non per tag: il progetto non pubblica
  # tag di versione sul registro, e `latest` si sposta sotto i piedi.
  theharvester:
    image: ghcr.io/laramies/theharvester@sha256:8cb9cb51f52e5d31e50b805197a13e22dde1295e8300b42ec81c0a1f11e4941a
    profiles: ["osint"]
    restart: unless-stopped
    # L'immagine ha ENTRYPOINT ["harvestview"]: qui vanno SOLO i suoi
    # argomenti. Il comando precedente passava `restfulHarvest --rate-limit
    # 60/minute`, che diventava `harvestview restfulHarvest ...` -- e il
    # contenitore ripartiva in loop con «unrecognized arguments», mentre
    # `docker compose up` sembrava riuscito. `restfulHarvest` non esiste piu'
    # fra gli entry point del progetto, e il limite di frequenza non e' piu'
    # un'opzione della riga di comando.
    command: ["-H", "0.0.0.0", "-p", "8000"]
    # 8000 e non 5000: e' la porta che l'immagine dichiara e su cui il
    # processo ascolta.
    expose: ["8000"]
    environment:
      # L'API rifiuta ogni richiesta senza chiave (503 se il servizio non ne
      # ha una, 401 se non coincide). La sceglie chi installa, come per ZAP, e
      # deve essere la stessa che riceve il worker.
      THEHARVESTER_API_KEY: ${THEHARVESTER_API_KEY:-}
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging: *logging


  # SpiderFoot: costruito da noi dal sorgente, perche' il progetto non pubblica
  # un'immagine utilizzabile (vedere deploy/spiderfoot/Dockerfile per il
  # dettaglio, Python 3.9 compreso e perche').
  #
  # Nessuna porta pubblicata, a differenza della definizione che c'era fino
  # alla 0.18.1: quella esponeva la 5001 sull'host, e SpiderFoot senza file
  # `passwd` non chiede autenticazione. Era un motore di scansione comandabile
  # da chiunque fosse sulla stessa rete. Qui ci parla solo il worker.
  spiderfoot:
    build:
      context: ./deploy/spiderfoot
      args:
        SPIDERFOOT_COMMIT: b9c345de5b085debc7444fc10e0e26e7745df5f2
    profiles: ["osint"]
    restart: unless-stopped
    expose: ["5001"]
    volumes:
      - spiderfoot-data:/var/lib/spiderfoot
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging: *logging

  # Rete separata per gli strumenti che usano Tor (AIL Framework, fase 3).
  tor-proxy:
    image: dperson/torproxy:latest
    profiles: ["tor"]
    restart: unless-stopped
    networks: [tor]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging: *logging

volumes:
  postgres-data:
  feed-cache:
  spiderfoot-data:
  redis-data:
  evidence-data:
  report-data:
  state-data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
  tor:
    driver: bridge
